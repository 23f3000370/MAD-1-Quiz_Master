<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Summary</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body>
    <nav class="nav">
        <div class="nav-left">
            <a href="{{ url_for('admin.admin_dashboard') }}"><button class="nav-button"><i
                        class="fas fa-home fa-2x"></i></button></a>
            <a href="{{ url_for('admin.view_quiz') }}"><button class="nav-button"><i
                        class="fas fa-list fa-2x"></i></button></a>
            <a href="{{ url_for('admin.add_subject') }}"><button class="nav-button"><i
                        class="fas fa-book fa-2x"></i></button></a>
            <a href="{{ url_for('admin.add_chapter') }}"><button class="nav-button"><i
                        class="fas fa-file-alt fa-2x"></i></button></a>
            <a href="{{ url_for('admin.add_quiz') }}"><button class="nav-button"><i
                        class="fas fa-tasks fa-2x"></i></button></a>
            <a href="{{ url_for('admin.add_question') }}"><button class="nav-button"><i
                        class="fas fa-question-circle fa-2x"></i></button></a>
            <a href="{{ url_for('admin.admin_summary') }}"><button class="nav-button"><i
                        class="fas fa-chart-bar fa-2x"></i></button></a>
            <a href="{{ url_for('auth.logout') }}"><button class="nav-button"><i
                        class="fas fa-sign-out-alt fa-2x"></i>logout</button></a>

        </div>

    </nav>
    <div class="container">
        <h2>Admin Summary Dashboard</h2>

        <!-- Subject-wise User Attempts (Bar Chart) -->
        <h3>Subject-wise User Attempts</h3>
        <canvas id="subjectAttemptsChart" width="500" height="300"></canvas>

        <!-- Subject-wise Top Scores (Pie Chart) -->
        <h3>Subject-wise Top Scores</h3>
        <canvas id="subjectScoresChart" width="500" height="300"></canvas>

    </div>
    <script>
       
        var subjectLabels = JSON.parse('{{ subject_attempts | tojson | safe }}');
        var subjectData = JSON.parse('{{ subject_attempts | tojson | safe }}');

        var ctx1 = document.getElementById('subjectAttemptsChart').getContext('2d');
        new Chart(ctx1, {
            type: 'bar',
            data: {
                labels: subjectLabels.map(item => item[0]),
                datasets: [{
                    label: 'User Attempts',
                    data: subjectLabels.map(item => item[1]),
                    backgroundColor: 'rgba(54, 162, 235, 0.6)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1
                }]
            }
        });

        var scoreLabels = JSON.parse('{{ subject_top_scores | tojson | safe }}');

        var ctx2 = document.getElementById('subjectScoresChart').getContext('2d');
        new Chart(ctx2, {
            type: 'pie',
            data: {
                labels: scoreLabels.map(item => item[0]),
                datasets: [{
                    label: 'Top Scores',
                    data: scoreLabels.map(item => item[1]),
                    backgroundColor: ['red', 'blue', 'green', 'yellow', 'purple'],
                }]
            }
        });
    </script>
</body>
</html>
