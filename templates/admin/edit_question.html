<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body>
    <div class="form-container">
        <form method="POST">
            <label for="question_title">Question:</label>
            <input type="text" id="question_title" name="question_title" value="{{ question[1] }}" required>
        
            <label for="option1">Option 1:</label>
            <input type="text" id="option1" name="option1" value="{{ question[2] }}" required>
        
            <label for="option2">Option 2:</label>
            <input type="text" id="option2" name="option2" value="{{ question[3] }}" required>
        
            <label for="option3">Option 3:</label>
            <input type="text" id="option3" name="option3" value="{{ question[4] }}" required>
        
            <label for="option4">Option 4:</label>
            <input type="text" id="option4" name="option4" value="{{ question[5] }}" required>
        
            <label for="answer">Correct Answer:</label>
            <input type="text" id="answer" name="answer" value="{{ question[6] }}" required>
        
            <button type="submit">Update Question</button>
            <a href="{{ url_for('admin.view_quiz') }}"><button type="button">Cancel</button></a>
        </form>


    </div>
    
    
</body>
</html>
